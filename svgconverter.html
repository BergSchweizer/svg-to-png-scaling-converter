function applyLanguage(){

    const selectedLanguage = language.value;
    const dictionary = translations[selectedLanguage];

    document.documentElement.lang = selectedLanguage;

    document.querySelectorAll("[data-i18n]").forEach(element=>{
        element.textContent =
        dictionary[element.dataset.i18n];
    });

    document.querySelectorAll("[data-i18n-placeholder]").forEach(element=>{
        element.placeholder =
        dictionary[element.dataset.i18nPlaceholder];
    });

    document.querySelectorAll("[data-i18n-aria]").forEach(element=>{
        element.setAttribute(
            "aria-label",
            dictionary[element.dataset.i18nAria]
        );
    });

}

language.onchange = applyLanguage;
applyLanguage();



/*
 Theme
*/


const theme =
document.getElementById("theme");



function applyTheme(){


    document.body.className="";


    if(theme.value==="light"){

        document.body.classList.add("light");

    }


    if(theme.value==="dark"){

        document.body.classList.add("dark");

    }


    if(theme.value==="system"){


        if(
        window.matchMedia(
        "(prefers-color-scheme: dark)"
        ).matches
        ){

            document.body.classList.add("dark");

        }
        else {

            document.body.classList.add("light");

        }

    }


}



theme.onchange=applyTheme;


window
.matchMedia(
"(prefers-color-scheme: dark)"
)
.addEventListener(
"change",
()=>{

    if(theme.value==="system")
        applyTheme();

});



applyTheme();









/*
 SVG laden
*/


svgInput.onchange=function(){


    let file=this.files[0];

    if(!file)return;



    let reader =
    new FileReader();


    reader.onload=function(e){

        const svgText = e.target.result;

        const dimensionMatch = parseSvgDimensions(svgText);

        svgWidth = dimensionMatch && dimensionMatch.w ? dimensionMatch.w : 0;

        svgHeight = dimensionMatch && dimensionMatch.h ? dimensionMatch.h : 0;

        let blob =
        new Blob(
        [svgText],
        {
            type:"image/svg+xml"
        });

        let url =
        URL.createObjectURL(blob);

        svgImage =
        new Image();

        svgImage.onload=function(){

            const naturalW =
            svgImage.naturalWidth || svgWidth || 1000;

            const naturalH =
            svgImage.naturalHeight || svgHeight || 1000;

            svgRatio =
            naturalW / naturalH;

            if(template.value==="original"){

                canvasW =
                naturalW;

                canvasH =
                naturalH;

                updateSize();

            }

            render();

        };

        svgImage.src=url;

    };


    reader.readAsText(file);


};








/*
 Hintergrund laden
*/


bgInput.onchange=function(){


    let file=this.files[0];

    if(!file)return;


    let img =
    new Image();


    img.onload=function(){

        bgImage=img;

        backgroundMode.value="image";

        render();

    };


    img.src =
    URL.createObjectURL(file);

};









/*
 Entfernen
*/


removeSVG.onclick=function(){

    svgImage=null;

    svgInput.value="";

    render();

};



removeBG.onclick=function(){

    bgImage=null;

    bgInput.value="";

    if(backgroundMode.value==="image")
        backgroundMode.value="transparent";


    render();

};









/*
 Vorlage
*/


template.onchange=function(){


    switch(this.value){


        case "a4portrait":

            canvasW=2480;
            canvasH=3508;

        break;


        case "a4landscape":

            canvasW=3508;
            canvasH=2480;

        break;


        case "16x9":

            canvasW=1920;
            canvasH=1080;

        break;

        case "9x16":

            canvasW=1080;
            canvasH=1920;

        break;

        case "3x4portrait":

            canvasW=1440;
            canvasH=1920;

        break;

        case "3x4landscape":

            canvasW=1920;
            canvasH=1440;

        break;


        case "original":

            if(svgImage){

                const naturalW =
                svgImage.naturalWidth || svgWidth || 1000;

                const naturalH =
                svgImage.naturalHeight || svgHeight || 1000;

                canvasW = naturalW * scale;

                canvasH = naturalH * scale;

            }

        break;


    }


    updateSize();

    render();


};









/*
 Größe
*/


widthInput.oninput=function(){


    if(updating)return;


    canvasW =
    Number(this.value)||1;


    if(lockRatio.checked){

        updating=true;

        canvasH =
        Math.round(
        canvasW /
        (canvasW/canvasH)
        );


        updateSize();


        updating=false;

    }


    render();

};



heightInput.oninput=function(){


    if(updating)return;


    canvasH =
    Number(this.value)||1;


    render();


};





lockRatio.onchange=function(){

    render();

};






function clamp(value, min, max){

    return Math.min(
    Math.max(value, min),
    max
    );

}


function updatePositionRange(){

    posXSlider.min = -canvasW;

    posXSlider.max = canvasW;

    posYSlider.min = -canvasH;

    posYSlider.max = canvasH;

}


function updatePositionLabels(){

    posXLabel.innerText = posX;

    posYLabel.innerText = posY;

}


function updateSize(){

    widthInput.value=
    Math.round(canvasW);

    heightInput.value=
    Math.round(canvasH);

    updatePositionRange();

    posX = clamp(
    posX,
    Number(posXSlider.min),
    Number(posXSlider.max)
    );

    posY = clamp(
    posY,
    Number(posYSlider.min),
    Number(posYSlider.max)
    );

    posXInput.value = posX;

    posXSlider.value = posX;

    posYInput.value = posY;

    posYSlider.value = posY;

    updatePositionLabels();

}


function updateCanvasSizeForOriginal(){

    if(template.value !== "original" || !svgImage) return;

    const naturalW =
    svgImage.naturalWidth || svgWidth || 1000;

    const naturalH =
    svgImage.naturalHeight || svgHeight || 1000;

    canvasW = naturalW * scale;

    canvasH = naturalH * scale;

    updateSize();

}


function parseSvgDimensions(svgText){

    const viewBoxMatch = svgText.match(/viewBox\s*=\s*"([^"]+)"/i) || svgText.match(/viewBox\s*=\s*'([^']+)'/i);

    if(viewBoxMatch){

        const parts = viewBoxMatch[1]
        .trim()
        .split(/[\s,]+/)
        .map(Number);

        if(parts.length===4 && !parts.some(isNaN)){

            return { w: parts[2], h: parts[3] };

        }

    }

    const widthMatch = svgText.match(/width\s*=\s*"([^"]+)"/i) || svgText.match(/width\s*=\s*'([^']+)'/i);
    const heightMatch = svgText.match(/height\s*=\s*"([^"]+)"/i) || svgText.match(/height\s*=\s*'([^']+)'/i);

    if(widthMatch && heightMatch){

        const w = parseFloat(widthMatch[1]);
        const h = parseFloat(heightMatch[1]);

        if(!isNaN(w) && !isNaN(h)){

            return { w, h };

        }

    }

    return null;

}

function attachHoverScroll(element){

    element.addEventListener(
    "wheel",
    function(e){

        e.preventDefault();

        let delta =
        e.deltaY < 0 ? 1 : -1;

        if(element.type === "number" || element.type === "range"){

            let step =
            Number(element.step) || 1;

            let value =
            Number(element.value) || 0;

            element.value =
            value + delta * step;

            element.dispatchEvent(
            new Event("input", { bubbles: true })
            );

        } else if(element.tagName === "SELECT"){

            let idx =
            element.selectedIndex + delta;

            idx = Math.min(
            Math.max(idx, 0),
            element.options.length - 1
            );

            if(idx !== element.selectedIndex){

                element.selectedIndex = idx;

                element.dispatchEvent(
                new Event("change", { bubbles: true })
                );

            }

        }

    },
    { passive: false }
    );

}


[scaleSlider, posXSlider, posXInput, posYSlider, posYInput, widthInput, heightInput, align, verticalAlign, template, backgroundMode, theme].forEach(
    attachHoverScroll
);

/*
 Render Engine
*/


function render(){


    canvas.width =
    canvasW;


    canvas.height =
    canvasH;


    ctx.clearRect(
    0,
    0,
    canvasW,
    canvasH
    );




    /*
    Hintergrund
    */


    if(backgroundMode.value==="white"){


        ctx.fillStyle="white";


        ctx.fillRect(
        0,
        0,
        canvasW,
        canvasH
        );

    }



    if(
    backgroundMode.value==="image"
    &&
    bgImage
    ){


        ctx.drawImage(
        bgImage,
        0,
        0,
        canvasW,
        canvasH
        );

    }






    /*
    SVG Layer
    */


    if(svgImage){


        let w =
        svgImage.naturalWidth *
        scale;


        let h =
        svgImage.naturalHeight *
        scale;



        let x=posX;


        let y=posY;



        if(align.value==="center"){

            x +=
            (canvasW-w)/2;

        }


        if(align.value==="right"){

            x +=
            canvasW-w;

        }


        if(verticalAlign.value==="center"){

            y +=
            (canvasH-h)/2;

        }


        if(verticalAlign.value==="bottom"){

            y +=
            canvasH-h;

        }


        ctx.imageSmoothingEnabled=false;


        ctx.drawImage(
        svgImage,
        x,
        y,
        w,
        h
        );


    }




    status.innerHTML =
    canvasW+
    " × "+
    canvasH+
    " px";

}

    posY=0;


    scaleSlider.value=1;

    scaleValue.innerHTML="1";


    posXInput.value=0;

    posYInput.value=0;

    posXSlider.value=0;

    posYSlider.value=0;

    updatePositionLabels();


    align.value="center";

    verticalAlign.value="center";


    template.value="original";


    if(svgImage){

        canvasW=
        svgImage.naturalWidth;

        canvasH=
        svgImage.naturalHeight;

    }


    updateSize();

    render();


};
